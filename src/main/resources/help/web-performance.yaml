bundle: web-performance
version: 1
layer: QBIT
# Help for the Performance app and every web_performance_* table, in the QQQ
# help-bundle format (qqq#1198). Each table entry says what the table is for and
# how its rows get created, so an empty table explains itself. WebPerfHelp
# applies it until the core HelpBundles registry ships in a QQQ release.
# Summaries stay under 120 characters (WebPerfTablesGuardrailTest).
entries:
  - key: app:webPerformance;slot:help
    summary: "Page speed for your site: Lighthouse lab tests, Google field data, budgets and regressions."
    content: |
      The Setup card on the home lists what is configured and the next step: sync the pages, give the qbit a Google API key, and review the budgets. A new installation starts with reference budgets (Google's good thresholds) already in place.

  - key: table:web_performance_target;slot:help
    summary: "The pages that get tested: one row per URL, with its tier, latest scores and open regressions."
    content: |
      **How rows get created:** run Sync pages from sitemap (also scheduled), which adds every page the host's URL source returns and links it to its content record. You can also add a page by hand with New. Mark a page KEY to put it in the site scores and the frequent tests. Run site audit or Test page speed queues lab tests.

  - key: table:web_performance_lab_run;slot:help
    summary: "Every Lighthouse test of a page: queued, running, finished or failed, with its scores and timings."
    content: |
      **How rows get created:** by the qbit. Test page speed, Run site audit and the schedules queue runs here, and the worker runs them through the lab runner (PageSpeed Insights when a Google API key is set). Nothing is added by hand. Without a key, runs wait in the queue. Retry re-queues a failed run.

  - key: table:web_performance_lab_finding;slot:help
    summary: "What Lighthouse says to fix on each tested page: the audits that failed and how much they would save."
    content: |
      **How rows get created:** by the qbit, from each finished lab run. One row per failed or opportunity audit. It stays empty until a lab test succeeds.

  - key: table:web_performance_lab_report;slot:help
    summary: "The complete Lighthouse response of each run, compressed, for download and later comparison."
    content: |
      **How rows get created:** by the qbit, one per successful lab run. Nothing to set up. Reports are kept forever unless the host sets reportRetentionDays, which deletes older reports (the run and its scores stay).

  - key: table:web_performance_field_snapshot;slot:help
    summary: "What Google's field data (CrUX) says real Chrome users experience: p75 Core Web Vitals per URL or origin."
    content: |
      **How rows get created:** by the qbit. Refresh Google field data (and the daily schedule) asks Google for the site and each tested page. It needs the Google API key. A row says NO_DATA when Google has too little traffic to publish figures for that page.

  - key: table:web_performance_budget;slot:help
    summary: "Limits a metric must stay within, per site, tier, page, content table or path; a breach raises a regression."
    content: |
      **How rows get created:** the qbit seeds reference budgets (Google's good thresholds for each Core Web Vital, and Lighthouse category scores for KEY pages), so a new installation already flags slow pages. Edit them, turn them off, or add your own with New. Lab and Google field data (CRUX) budgets are evaluated; budgets with source RUM (real users) are not evaluated yet, because no real-user source is wired in.

  - key: table:web_performance_regression;slot:help
    summary: "A page that got slower or broke a budget: suspected, confirmed, then resolved or dismissed."
    content: |
      **How rows get created:** by the qbit. When a test breaks a budget or drifts from its baseline, it opens a suspected regression and confirms it after more runs. Mark resolved and Dismiss close one by hand. Empty means nothing is wrong.

  - key: table:web_performance_change_event;slot:help
    summary: "Site changes (a deploy, a Lighthouse version, a CDN stage change) that trigger re-tests."
    content: |
      **How rows get created:** by the qbit. Check site changes (scheduled when deploy probes or change sources are configured) records a change, and the qbit notes when Lighthouse itself changes version. It stays empty until the host configures a deploy probe or change event source.

  - key: table:web_performance_comparison;slot:help
    summary: "Before and after results around a site change, per page and metric."
    content: |
      **How rows get created:** run Compare before and after on a change event (it needs the CDN_COMPARE feature and a change event). Nothing to add by hand.
